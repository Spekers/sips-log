	.pile-hint { color: #555; font-style: italic; margin-top: 0; }
	.pile {

	.pile.is-live {
		display: block;
		position: relative;
		height: 320px;
		overflow: hidden;
		touch-action: none;

	.pile-item:link, .pile-item:visited, .pile-item {
		display: block;
		position: relative;

		width: 64px;
		height: 64px;
		background: #c0c0c0;
		border: 2px solid #000;
		text-shadow: none;
		text-decoration: none;
		user-select: none;
		-webkit-user-select: none;
		cursor: grab;
	}
	.pile.is-live .pile-item {
		position: absolute;
		left: 0;
		top: 0;
		will-change: transform;
	}
	.pile-item img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
	/* Bevel sits on top of the image; an inset shadow on the link itself would be hidden underneath it. */
	.pile-item::after {
		content: "";
		position: absolute;
		inset: 0;
		box-shadow: inset -3px -3px 0 #808080, inset 3px 3px 0 #fff;
		pointer-events: none;
	}
	.pile-item.is-held { cursor: grabbing; z-index: 1; }
	@media (max-width: 1080px) {
		.pile { width: 100%; }
	}
</style>
