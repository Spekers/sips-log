		</div>
		<div class="window-body">
			<p><strong>Date:</strong> ★MIX_DATE★</p>
			<img class="cover" src="★MIX_COVER★" alt="★MIX_TITLE★ cover"/>
		</div>
	</div>

	<div class="window">
		<div class="title-bar"><div class="title-bar-text">Windows Media Player</div></div>
		<div class="window-body player">
			<div class="transport">
				<button id="playBtn" style="width: 64px;" data-feed="★MIX_MIXCLOUD★">Play</button>
			</div>
		</div>
	</div>

	<div class="window">

		</div>
	</div>

	<div class="window">
		<div class="title-bar"><div class="title-bar-text">Tracklist</div></div>

		</div>

★COMMENTS★

<script>
(function() {
	const playBtn = document.getElementById("playBtn");
	let footer = null;

	playBtn.addEventListener("click", () => {
		if (footer) {
			footer.remove();
			footer = null;
			document.body.classList.remove("has-mix-footer");
			playBtn.textContent = "Play";
			return;
		}
		footer = document.createElement("div");
		footer.className = "mix-footer";
		const iframe = document.createElement("iframe");
		iframe.title = "Mixcloud player";
		iframe.allow = "autoplay; encrypted-media";
		iframe.src = "https://www.mixcloud.com/widget/iframe/?hide_cover=1&mini=1&autoplay=1&feed=" + encodeURIComponent(playBtn.dataset.feed);
		footer.appendChild(iframe);
		document.body.appendChild(footer);
		document.body.classList.add("has-mix-footer");
		playBtn.textContent = "Close";
	});
})();
</script>
</article>
